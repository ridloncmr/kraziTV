# Publishes the Docker image when a GitHub Release is published, so a
# first-time user pulls kraziTV instead of building it. The release tag
# becomes the image tag; a full release also moves `latest`, a pre-release
# does not. CI remains the pull-request check and builds nothing here.
#
# THIRD_PARTY_NOTICES.md is maintained by hand: update it before publishing a
# release. `npm test` fails when a web runtime dependency is missing from it.
name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish-image:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ridloncmr/krazitv:${{ github.event.release.tag_name }}
            ${{ github.event.release.prerelease == false && 'ghcr.io/ridloncmr/krazitv:latest' || '' }}
          labels: |
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.revision=${{ github.sha }}
