name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format

      - name: Check generated plan status
        run: npm run plan:status:check

      - name: Check Claude skill adapters
        run: npm run agents:check

      - name: Audit source layout and composition
        run: npm run audit:strict

      # Typecheck builds workspace declarations into dist/, which type-aware
      # lint needs to resolve cross-package imports.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run available tests
        run: npm test

      - name: Build
        run: npm run build

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite imports the server's source, which resolves workspace
      # packages through their built dist/.
      - name: Build workspace packages
        run: npm run build:node

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser --workspace @krazitv/web

      - name: Upload traces from failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: data/web-browser-results/
          if-no-files-found: ignore
